<!doctype html>
<html lang="en" class="preloading">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <script>
    // Apply the saved theme before first paint so there is no flash. "system" (the default) follows the OS.
    (function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;
    if(localStorage.getItem('lang')==='si'){document.documentElement.lang='si';var l=document.createElement('link');l.id='font-sinhala';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap';document.head.appendChild(l);}}catch(e){}
    var d=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
    document.querySelector('meta[name="theme-color"]').content=d?'#191919':'#ffffff';})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load the font without blocking first paint; text renders in the fallback until Inter arrives. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
    <link rel="icon" type="image/png" href="/logo-small.png">
    <!--app-head-->
    <style>
    /* Loading screen: inlined so it paints before any other file arrives. */
    #preloader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#fff;color:#111;transition:opacity .5s ease,visibility .5s}
    :root[data-theme="dark"] #preloader{background:#191919;color:#ededeb}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #preloader{background:#191919;color:#ededeb}}
    .loaded #preloader{opacity:0;visibility:hidden;pointer-events:none}
    .preloader-inner{display:flex;flex-direction:column;align-items:center;gap:22px}
    .preloader-mark{font:900 clamp(34px,7vw,56px)/1 "Arial Black","Arial Bold",Gadget,Arial,sans-serif;letter-spacing:-.005em;animation:preloader-in .6s cubic-bezier(.2,.7,.2,1) both}
    .preloader-mark span{color:#5cb944}
    .preloader-dots{display:flex;gap:10px}
    .preloader-dots i{width:12px;height:12px;border-radius:50%;animation:preloader-bounce 1s ease-in-out infinite}
    .preloader-dots i:nth-child(1){background:#5cb944}
    .preloader-dots i:nth-child(2){background:#0289d3;animation-delay:.15s}
    .preloader-dots i:nth-child(3){background:#f29a04;animation-delay:.3s}
    @keyframes preloader-in{from{opacity:0;transform:translateY(14px)}}
    @keyframes preloader-bounce{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-12px);opacity:1}}
    @media(prefers-reduced-motion:reduce){.preloader-mark,.preloader-dots i{animation:none}}
    /* Green loading line across the very top: creeps forward while a page loads, then completes and fades. */
    #load-bar{position:fixed;inset:0 auto auto 0;z-index:200;height:3px;width:100%;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,#3f8f2a,#5cb944 60%,#9be07a);box-shadow:0 0 10px rgba(92,185,68,.7),0 0 3px rgba(92,185,68,.9);pointer-events:none;transition:transform .4s ease,opacity .4s ease .2s}
    #load-bar.running{transition:transform 8s cubic-bezier(.1,.6,.2,1)}
    #load-bar.done{transform:scaleX(1)!important;opacity:0;transition:transform .3s ease,opacity .35s ease .3s}
    </style>
</head>

<body>
    <div id="load-bar" aria-hidden="true"></div>
    <div id="preloader" aria-hidden="true"><div class="preloader-inner"><div class="preloader-mark">Calcus<span>Ai</span></div><div class="preloader-dots"><i></i><i></i><i></i></div></div></div>
    <div id="app"><!--app-html--></div>
    <script>
    // Hide the loading screen once the page has loaded (shown at least briefly so it never flickers, at most 3s).
    (function(){var root=document.documentElement,start=Date.now(),finished=false;
    function done(){if(finished)return;finished=true;setTimeout(function(){root.classList.remove('preloading');root.classList.add('loaded');
    setTimeout(function(){var el=document.getElementById('preloader');if(el)el.remove();},700);},Math.max(0,450-(Date.now()-start)));}
    if(document.readyState==='complete')done();else window.addEventListener('load',done,{once:true});setTimeout(done,3000);})();
    // Loading line: start now, finish on load. Clicking a link to another page on this site starts it again straight away.
    (function(){var bar=document.getElementById('load-bar');
    function start(){bar.classList.remove('done');bar.classList.remove('running');bar.style.transform='scaleX(.08)';void bar.offsetWidth;bar.classList.add('running');bar.style.transform='scaleX(.85)';}
    function finish(){bar.classList.remove('running');bar.classList.add('done');}
    start();
    if(document.readyState==='complete')setTimeout(finish,200);else window.addEventListener('load',function(){setTimeout(finish,150);},{once:true});
    setTimeout(finish,8000);
    document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');
     if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||a.target==='_blank'||a.hasAttribute('download'))return;
     var url=new URL(a.href,location.href);if(url.origin!==location.origin)return;
     if(url.pathname===location.pathname&&url.search===location.search)return;
     start();});
    // Coming back with the browser's back button can restore the page from memory; make sure the line is not left running.
    window.addEventListener('pageshow',function(e){if(e.persisted)finish();});})();
    </script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
