<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050b1a"><title>Olivia Studio — Calcus Ai Colombo</title><meta name="description" content="Calcus Ai. Design that speaks your brand, from Colombo after dark.">
<style>
@font-face{font-family:Anton;src:url(anton.woff2) format("woff2");font-display:swap}:root{color-scheme:dark;--paper:#071020;--ink:#fff;--line:#ffffff35;--veil:linear-gradient(180deg,rgba(1,8,24,.70),rgba(1,8,24,.16) 45%,rgba(1,8,24,.6));--nav:rgba(7,16,32,.7)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}body{transition:background .5s,color .5s}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #9bed4d;outline-offset:6px}header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 3.3vw;border-bottom:1px solid var(--line);position:relative;z-index:5;background:var(--paper)}.brand{font-size:16px;letter-spacing:-.6px;font-weight:600;display:flex;align-items:center;gap:9px}.brand span{font-size:36px;font-weight:400;line-height:1}.nav{display:flex;gap:31px;align-items:center;font-size:13px;font-weight:500}a:hover{opacity:.65}.theme{border:1px solid var(--line);width:42px;height:42px;background:transparent;border-radius:50%;display:grid;place-items:center}.theme svg{width:19px;height:19px}.sun{display:block}.moon{display:none}.hero{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;background:#06152c}.city{position:absolute;inset:0;z-index:-3;background-image:url('https://images.unsplash.com/photo-1634925367320-9053ca47a16f?fm=jpg&ixlib=rb-4.1.0&q=60&w=3000');background-size:cover;background-position:center 56%;transform:scale(1.04);animation:scene 20s ease-in-out infinite alternate}.veil{position:absolute;inset:0;background:var(--veil);z-index:-2;transition:background .7s}h1{position:relative;margin:0 2.7vw;text-align:center;padding-top:4px;font-family:Anton,Impact,'Arial Narrow',sans-serif;font-size:clamp(80px,24.2vw,430px);font-weight:400;letter-spacing:-.022em;line-height:1.12;z-index:0;white-space:nowrap;transition:color .5s}.character{position:absolute;left:50%;top:18%;width:min(48vw,700px);height:75%;z-index:2;transform:translateX(-50%);pointer-events:none}.character img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 24px 32px #0008);animation:float 6s ease-in-out infinite}.tagline{position:absolute;right:8%;top:53%;font-size:clamp(15px,1.65vw,25px);font-weight:400;line-height:1.6;max-width:260px;text-transform:uppercase;z-index:3}.intro{position:absolute;bottom:6%;left:3.4%;font-size:clamp(12px,1vw,15px);line-height:1.8;max-width:360px;text-transform:uppercase;z-index:3}.location{position:absolute;bottom:5.5%;right:3.4%;font-size:12px;letter-spacing:.08em;z-index:3;text-transform:uppercase}.location span{display:block;opacity:.65;margin-top:8px}.ground{position:absolute;left:50%;bottom:7%;width:30%;height:5%;transform:translateX(-50%);background:#0006;filter:blur(18px);border-radius:50%;z-index:1}.stars{position:absolute;inset:0;z-index:1;pointer-events:none}.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 8px #c4edff;animation:twinkle 4s ease-in-out infinite}.light{--paper:#fff;--ink:#101820;--line:#10182030;--veil:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.58) 52%,rgba(255,255,255,.90));color-scheme:light}.light .sun{display:none}.light .moon{display:block}.light .character img{filter:drop-shadow(0 24px 30px #05122260)}.light .hero{background:#fff}.light .city{background-image:url('colombo-day.jpg');background-position:center 65%;filter:grayscale(1) brightness(1.25)}.light .stars{display:none}@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-18px) rotate(1deg)}}@keyframes scene{to{transform:scale(1.09) translateX(-.7%)}}@keyframes twinkle{50%{opacity:.2;transform:scale(.7)}}
@media(min-width:1700px){h1{font-size:24vw}.character{width:46vw;max-width:none}}@media(max-width:760px){header{height:72px;padding:0 5vw}.nav{gap:14px}.nav a{display:none}.nav .hire{display:block;font-size:12px}.brand{font-size:14px}.brand span{font-size:30px}.hero{min-height:100svh}h1{padding-top:28px;font-size:24vw;line-height:1.3;margin:0 3vw}.character{top:19%;width:95vw;height:55%}.tagline{top:auto;bottom:15%;left:5%;right:auto;font-size:16px;max-width:200px}.intro{bottom:5%;left:5%;max-width:270px;font-size:12px}.location{display:none}.city{background-position:60% center}.ground{width:60%;bottom:20%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.character{top:29%;width:min(48vw,700px);height:auto}.face-stage{position:relative;width:100%;aspect-ratio:1310/1201;animation:float 6s ease-in-out infinite}.character img{display:block;width:100%;height:auto;animation:none}.gaze{position:absolute;inset:0;width:100%;height:100%}@media(max-width:760px){.character{top:29%;width:100vw;height:auto}}

/* Responsive hero composition. */
.hero{--alien-width:min(48vw,700px,78svh);--alien-bottom:-6svh;--title-lift:min(31.2vw,455px,50.7svh);min-height:100svh}
.character{top:auto;bottom:var(--alien-bottom);width:var(--alien-width);height:auto;z-index:2}
.face-stage{animation:none}
h1{position:absolute;left:0;right:0;top:auto;bottom:calc(var(--alien-bottom) + var(--title-lift));margin:0 2.7vw;padding:0;font-size:min(24vw,42svh);line-height:1.02;z-index:0}
.tagline{top:auto;right:clamp(24px,7vw,120px);bottom:clamp(70px,22svh,210px);max-width:280px;font-size:clamp(14px,1.45vw,22px);line-height:1.45;letter-spacing:-.025em;z-index:3}
@media(max-width:760px){
.hero{--alien-width:min(96vw,68svh);--alien-bottom:-4svh;--title-lift:min(62.4vw,44.2svh)}
.character{top:auto;bottom:var(--alien-bottom);width:var(--alien-width)}
h1{padding:0;margin:0 3vw;font-size:min(24vw,32svh);line-height:1.02}
.tagline{top:clamp(22px,7svh,64px);bottom:auto;left:5vw;right:auto;max-width:190px;font-size:clamp(12px,3.5vw,16px);line-height:1.45;letter-spacing:-.02em}
}
@media(max-width:760px) and (orientation:landscape){
.hero{--alien-width:min(48vw,82svh);--alien-bottom:-8svh;--title-lift:min(31.2vw,53.3svh)}
h1{margin:0 2vw;font-size:min(22vw,42svh)}
.tagline{top:auto;bottom:12svh;left:auto;right:4vw;max-width:180px}
}
</style></head>
<body>
<main class="hero"><div class="city" role="img" aria-label="Colombo skyline at night with the illuminated Lotus Tower"></div><div class="veil"></div><h1>Calcus Ai</h1><div class="stars" aria-hidden="true"></div><div class="character"><div class="face-stage"><img src="face.png" alt="A green alien in a bubble helmet whose eyes follow your pointer"><canvas class="gaze" width="1310" height="1201" aria-hidden="true"></canvas></div></div><p class="tagline">// DESIGN THAT<br>SPEAKS YOUR BRAND</p></main>
<script>
function applyTheme(light){document.querySelector('.city').setAttribute('aria-label',light?'Colombo skyline in daylight with the Lotus Tower':'Colombo skyline at night with the illuminated Lotus Tower');document.documentElement.classList.toggle('light',light);document.documentElement.dataset.theme=light?'light':'dark';document.querySelector('meta[name="theme-color"]').content=light?'#ffffff':'#050b1a'}try{applyTheme(localStorage.getItem('calcus-ai-theme')==='light')}catch{}const positions=[[5,8],[21,15],[45,9],[63,4],[84,18],[94,39],[7,61],[32,42],[73,34],[56,64],[16,29],[90,72]];positions.forEach(([x,y],i)=>{const s=document.createElement('i');s.className='star';s.style.cssText=`left:${x}%;top:${y}%;animation-delay:${i*.37}s`;document.querySelector('.stars').append(s)});
</script><script src="eyes.js"></script></body></html>
